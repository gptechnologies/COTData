name: Update Policy Rates

on:
  schedule:
    - cron: "15 11 * * *"
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: update-cot-data-files
  cancel-in-progress: false

jobs:
  update-policy-rates:
    runs-on: ubuntu-latest

    steps:
      - name: Check out repo
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      - name: Install dependencies
        run: pip install -r requirements.txt

      - name: Update policy rates
        run: python scripts/update_policy_rates.py

      - name: Commit updated CSV
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"

          git add policy_rates.csv

          if git diff --cached --quiet; then
            echo "No policy-rate changes to commit."
          else
            git commit -m "Update policy rates"
            git push
          fi
